name: "Release"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild, for example v1.0.8"
        required: true
        type: string

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      id-token: write
    env:
      BM6_ROOT_DIR: "${{ github.workspace }}/custom_components/bm6"
      RELEASE_TAG: "${{ github.event.release.tag_name || inputs.tag }}"
    steps:
      - name: "Validate the existing release tag"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          if ! git check-ref-format "refs/tags/${RELEASE_TAG}" ||
             ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --silent; then
            echo "::error::The supplied tag does not exist or is invalid."
            exit 1
          fi
          if ! gh release view --repo "${GITHUB_REPOSITORY}" -- "${RELEASE_TAG}" >/dev/null; then
            echo "::error::The supplied tag must already have a GitHub release."
            exit 1
          fi

      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          ref: "refs/tags/${{ env.RELEASE_TAG }}"

      - name: "Adjust version number"
        shell: bash
        run: |
          version="${RELEASE_TAG}"
          version="${version,,}"
          version="${version#v}"
          # update const.py
          sed -i \
            "/^VERSION.*=./c\VERSION = \"${version}\"" \
            "${{ env.BM6_ROOT_DIR }}/const.py"
          # update manifest.json
          jq ".version = \"${version}\"" "${{ env.BM6_ROOT_DIR }}/manifest.json" > "${{ env.BM6_ROOT_DIR }}/manifest.json.tmp"
          mv "${{ env.BM6_ROOT_DIR }}/manifest.json.tmp" "${{ env.BM6_ROOT_DIR }}/manifest.json"

      - name: "Zip the integration directory"
        run: |
          cd "${{ env.BM6_ROOT_DIR }}"
          zip bm6.zip -r ./

      - name: "Sign release package"
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: "${{ env.BM6_ROOT_DIR }}/bm6.zip"
          # On release events sigstore signs and uploads the ZIP, its bundle,
          # and the source archives with their bundles; do not upload twice.
          release-signing-artifacts: "${{ github.event_name == 'release' }}"

      - name: "Replace the ZIP and signature on the existing release"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          for file in "${BM6_ROOT_DIR}/bm6.zip" "${BM6_ROOT_DIR}/bm6.zip.sigstore.json"; do
            if [[ ! -f "${file}" ]]; then
              echo "::error::Required release asset is missing: ${file}"
              exit 1
            fi
          done
          # Upload assets directly to avoid PATCHing the release metadata,
          # which can require workflow permissions for an older release tag.
          gh release upload "${RELEASE_TAG}" \
            "${BM6_ROOT_DIR}/bm6.zip" \
            "${BM6_ROOT_DIR}/bm6.zip.sigstore.json" \
            --clobber --repo "${GITHUB_REPOSITORY}"
